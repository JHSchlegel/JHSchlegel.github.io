project:
  type: website
  output-dir: "docs"
  resources:
    - research/
  render:
    - "**/*.qmd"
    - "!quarto-handoff/**"
    - "!quarto-research/**"

execute:
  freeze: auto
  jupyter:
    python: /home/janhsc/Documents/projects/JHSchlegel.github.io/.venv/bin/python

website:
  title: "Jan Schlegel"
  # Keep drafts renderable while excluding them from listings and navigation.
  # This also prevents incremental preview renders from becoming blank.
  draft-mode: unlinked
  site-url: "https://jhschlegel.github.io"
  favicon: logo.png
  navbar:
    logo: profile.jpg
    logo-alt: "Jan Schlegel"
    title: "Jan Schlegel"
    pinned: true
    left:
      - text: "Blog"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Research"
        href: research.qmd
      - text: "Photography"
        href: photography.qmd
    right:
      - text: "CV"
        href: CV_Academic.pdf
      - icon: github
        href: https://github.com/JHSchlegel
      - icon: linkedin
        href: https://www.linkedin.com/in/jan-heinrich-schlegel/
  page-footer:
    left: "© 2026 Jan Schlegel"
    right:
      - icon: github
        href: https://github.com/JHSchlegel
      - icon: linkedin
        href: https://www.linkedin.com/in/jan-heinrich-schlegel/

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark:  [cosmo, theme-dark.scss]
    css: custom.css
    toc: false
    fontsize: 1rem
    grid:
      body-width: 900px
    link-external-newwindow: true
    include-in-header:
      - text: |
          <meta name="color-scheme" content="dark light">
    include-after-body:
      - theme-icon.js
      - lightbox.js
